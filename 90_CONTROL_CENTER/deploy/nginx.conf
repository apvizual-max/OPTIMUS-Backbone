# =============================================================================
#  mavis-optimus-control-center - local deployment front
#  Generated by Mavis for the MiniMax OPTIMUS Control Center.
#
#  WHAT THIS IS: the deployment surface. The dashboard itself is a Windows
#  PowerShell service (it reads Windows-only facts: WMI, Get-NetTCPConnection,
#  the Hermes CLI, the Docker Windows engine), so it runs on the host. This
#  container fronts it: one stable, container-owned address, health gating, and
#  a single place to add TLS later when the service goes public.
#
#  WHAT THIS IS NOT: a second copy of the app, and not a public endpoint. The
#  published port is bound to 127.0.0.1 in the run command, so it is reachable
#  from this machine and nowhere else.
# =============================================================================

upstream optimus_console {
    # host.docker.internal is Docker's name for the Windows host. The dashboard
    # listens on 8900 there.
    server host.docker.internal:8900;
    keepalive 8;
}

server {
    listen      80;
    server_name localhost;

    # The dashboard is a single-page app served from disk, so the root is
    # proxied wholesale. No static root on purpose: this container holds no
    # copy of the app and must never drift from what the host is actually
    # serving.
    location / {
        proxy_pass         http://optimus_console;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # /api/ask returns a job id in under a second now, but an action can
        # still take a while before the caller polls. Do not cut a long poll
        # short: a truncated answer is worse than a slow one.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering      off;
        proxy_cache          off;
    }

    # A dedicated liveness path, separate from the app, so "is the gateway up"
    # and "is the dashboard behind it up" are two different questions and can be
    # answered independently. A health check that only ever asks the app cannot
    # tell a dead gateway from a dead app, and reports the wrong one.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"mavis-optimus-control-center","role":"deployment-front","status":"ok"}';
    }

    # Readiness of the thing BEHIND the gateway. If the Windows service has not
    # come up yet, this says so plainly instead of returning a dashboard error
    # page that looks like a broken app.
    location = /readyz {
        access_log off;
        proxy_pass         http://optimus_console/api/state;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    8s;
    }
}
