    d.containers.forEach(c=>rows.push([c.name,c.project,c.image,c.status,c.health||'']));
    const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    try{ await navigator.clipboard.writeText(csv); flash('Container table copied as CSV ('+d.containers.length+' rows).'); }
    catch(e){ flash('Clipboard blocked by the browser.'); }
  } else if(kind==='print'){ window.print(); }
  else if(kind==='digest'){
    try{
      const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:'Write a short handover briefing for the next person: current state, anything broken, and the top three things to do. Plain prose, no bullet-point noise.'})});
      const j=await r.json();
      await navigator.clipboard.writeText(j.answer||'');
      flash('AI briefing copied to the clipboard.');
    }catch(e){ flash('Could not build the briefing: '+e.message); }
  }
}

/* ============================== BINDING ================================ */
function bind(){
  const out=document.getElementById('out');
  document.querySelectorAll('#view .qs button[data-x]').forEach(b=>b.onclick=()=>doExport(b.dataset.x));
  // container drill-down
  document.querySelectorAll('#view tr.row').forEach(tr=>tr.onclick=()=>{
    const c=(S.sections.docker.containers||[]).find(x=>x.name===tr.dataset.n);
    const d=document.getElementById('drill');
    if(!c||!d){ if(d) d.innerHTML=note('That container is no longer in the current listing.'); return; }
    d.innerHTML='<div style="margin-top:12px">'
      +'<div class="note info">'+svg('gauge')+'<span><b>'+esc(c.name)+'</b></span></div>'
      +kv('<span>'+svg('layers')+'</span>compose project',esc(c.project))
      +kv('<span>'+svg('server')+'</span>image',esc(c.image||'not reported by inspect'))
      +kv('<span>'+svg('play')+'</span>state',esc(c.status),c.status==='running'?'ok':'bad')
      +kv('<span>'+svg('check')+'</span>health',esc(c.health||'no healthcheck defined'),c.health==='healthy'?'ok':'dim')
      +'</div>';
  });
  if(out) document.querySelectorAll('.act').forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.dataset.id; btn.querySelector('.btn').classList.add('run');
      outKeep='running '+(ACTIONS[id]?ACTIONS[id].c:id)+' …';
      const live1=document.getElementById('out'); if(live1) live1.textContent=outKeep;
      /* Actions are ASYNC for the same reason the analyst is. `doctor` measures
         ~12 s on this machine; run inline it froze every other reader for its
         full duration, and a timeout cap only makes that freeze BOUNDED - it
         does not remove it. The POST now returns a job id in milliseconds and
         the console stays live while the command runs. The operator still sees
         their output, just a few seconds later, and so does every other tab. */
      try{
        const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id})});
        const j=await r.json();
        if(!j.ok || !j.job){ outKeep='ERROR: '+(j.error||'the console did not start the job'); }
        else{
          const done=await pollAction(j.job);
          outKeep=(done.state==='done'?done.output:'ERROR: '+done.error)+'\n\n$ '+(ACTIONS[id]?ACTIONS[id].c:id);
        }
      }catch(e){ outKeep='ERROR: '+e.message; }
      const live2=document.getElementById('out'); if(live2) live2.textContent=outKeep;
      const lb=document.querySelector('.act[data-id="'+id+'"] .btn'); if(lb) lb.classList.remove('run');
    };
  });
  /* The front-end self-test button lives in viewFABRIC, not on the Resilience
     tab. An earlier comment here said Resilience, and it was wrong: the card is
     rendered by selftestCard() from viewFabric(), so on `resilience` this lookup
     returns null and the button silently has no handler. */
  /* ---- Ask a NotebookLM notebook, from the card that lists them -----------
   * Async because a measured answer takes 40-60 s and the page must keep
   * answering /api/state meanwhile. The job id comes back in ~500 ms.
   * Wired HERE, next to the other handlers, because the control lives in
   * viewOverview and a handler attached in the wrong view silently does
   * nothing - the same lesson as btnSelftest above. */
  /* An answer that disappears on the next poll is not an answer.
   The page re-renders every 5 s (`setInterval(poll, 5000)`), and the card is
   rebuilt from scratch each time - so a 45-second NotebookLM reply written
   straight into the DOM survived five seconds. It is held here instead and
   re-rendered, so a refresh costs the reader nothing.
   Same defect class as everything else in this project's history: produced
   correctly, displayed nowhere durable. */
  const nbBtn=document.getElementById('nbAsk');
  if(nbBtn) nbBtn.onclick=async()=>{
    const pick=document.getElementById('nbPick'), qIn=document.getElementById('nbQ'), out=document.getElementById('nbOut');
    if(!pick||!qIn||!out) return;                       // SPEC_R104: never touch what is not on the page
    const q=(qIn.value||'').trim();
    if(!q){ out.innerHTML=note('Type a question first.', 'warn'); return; }
    nbBtn.disabled=true;
    const t0=Date.now();
    let tick=setInterval(()=>{ const s=Math.round((Date.now()-t0)/1000);
      out.innerHTML=note('Asking <b>'+esc(pick.value)+'</b>... '+s+'s. This is a real round-trip to notebook.google.com.', 'info'); },1000);
    try{
      const r=await fetch('/api/notebook/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({notebook:pick.value,question:q})});
      const j=await r.json();
      clearInterval(tick);
      if(!j.job){
        // A refusal is a real answer. It is shown as what it is, never as an
        // empty reply that reads like "nothing found in the notebook".
        NBANSWER={html:note(esc(j.error||'the console refused this question')+' (HTTP '+r.status+')','bad')};
        return render();
      }
      let res=null;
      for(let i=0;i<80;i++){
        await new Promise(rr=>setTimeout(rr,3000));
        try{ res=await (await fetch('/api/notebook/ask/'+j.job)).json(); }catch(e){ continue; }
        if(res && res.state!=='running') break;
      }
      clearInterval(tick);
      if(!res||res.state==='running'){ NBANSWER={html:note('Still waiting after 4 minutes. The job is on the server; nothing was lost.','warn')}; return render(); }
      if(res.state==='done'&&res.answer){
        NBANSWER={html:'<div class="li ok">'+tic('check')+'<span><b>'+esc(res.notebook)+'</b> answered in '
          +Math.round((Date.now()-t0)/1000)+'s</span></div>'
          +'<div style="margin-top:6px;white-space:pre-wrap">'+esc(res.answer)+'</div>'};
        return render();
      }
      if(res.state==='unauthenticated'){
        NBANSWER={html:note('The NotebookLM session is signed out. '+esc(res.error||'Sign in on the minimax Chrome profile.')
          +(res.retry_after_sec?' Automatic retry in '+Math.ceil(res.retry_after_sec/60)+' min.':' No probe until then.'),'warn')};
        return render();
      }
      NBANSWER={html:note(esc(res.error||'the query failed'),'bad')};
      render();
    }catch(e){
      clearInterval(tick);
      NBANSWER={html:note('The console could not be reached: '+esc(String(e)),'bad')};
      render();
    }finally{ nbBtn.disabled=false; }
  };

  const stBtn=document.getElementById('btnSelftest');
  if(stBtn) stBtn.onclick=async()=>{
    stBtn.textContent='checking…';
    SELFTEST.results=uiSelfTest(); SELFTEST.ran=true; SELFTEST.at=new Date();
    const extra=await uiSelfTestBehaviour();          // the pass that runs a handler
    SELFTEST.results=SELFTEST.results.concat(extra);
    SELFTEST.at=new Date();
    render();
  };
  const go=document.getElementById('aiGo');
  if(go){
    const q=document.getElementById('aiQ');
    const ask=()=>askAI(q.value);
    go.onclick=ask;
    q.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask();} };
    const cl=document.getElementById('aiClear');
    /* Clear resets the RETAINED answer, not just the node. Wiping the element
       alone would let the next poll repaint the old answer straight back in. */
    if(cl) cl.onclick=()=>{ q.value=''; aiAnswer=null; aiPending=false; aiQuestion=null; aiFactsAt=null; aiAt=null; paintAI(); };
    document.querySelectorAll('#aiQs button').forEach(b=>b.onclick=()=>{ q.value=b.dataset.q; askAI(b.dataset.q); });
  }
}

/* ========================== COMMAND PALETTE ============================ */
let palSel=0, palItems=[], lastFocus=null;
function openPal(){ lastFocus=document.activeElement; document.getElementById('btnPal').setAttribute('aria-expanded','true'); document.getElementById('pal').classList.add('on'); const i=document.getElementById('palIn'); i.value=''; i.focus(); palSel=0; palBuild(); }
function closePal(){ document.getElementById('btnPal').setAttribute('aria-expanded','false'); document.getElementById('pal').classList.remove('on'); if(lastFocus) { lastFocus.focus(); lastFocus=null; } }
function palBuild(){
  const q=(document.getElementById('palIn').value||'').toLowerCase();
  palItems=[];
  TABS.forEach(([id,l,acc,ic,d])=>{ if(!q||l.toLowerCase().includes(q)||d.toLowerCase().includes(q))
    palItems.push({i:ic,label:l,sub:'tab',go:()=>{active=id;render();}}); });
  Object.entries(ACTIONS).forEach(([id,m])=>{ if(!q||m.t.toLowerCase().includes(q)||m.d.toLowerCase().includes(q))
    palItems.push({i:m.i,label:m.t,sub:'action',go:()=>{active='command';render();
      setTimeout(()=>{const b=document.querySelector('.act[data-id="'+id+'"]'); if(b)b.click();},60);}}); });
  if(q) palItems.push({i:'brain',label:'Ask: '+q,sub:'ai',go:()=>{active='ai';render();
    setTimeout(()=>{const t=document.getElementById('aiQ'); if(t){t.value=q; askAI(q);}},60);}});
  palSel=0; palPaint();
}
function palPaint(){
  const L=document.getElementById('palList');
  L.innerHTML=palItems.slice(0,40).map((x,i)=>
    '<button class="palrow'+(i===palSel?' sel':'')+'" data-i="'+i+'">'+svg(x.i)+'<span>'+esc(x.label)
    +'</span><span class="k">'+esc(x.sub)+'</span></button>').join('')||'<div class="palrow dim">nothing matches</div>';
  L.querySelectorAll('.palrow[data-i]').forEach(b=>b.onclick=()=>{ palItems[+b.dataset.i].go(); closePal(); });
}

/* ============================== SHORTCUTS ============================== */
const KEYS=[
  ['Ctrl / Cmd + K','open the command palette'],
  ['A','jump to the AI analyst'],
  ['1 – 9, 0, -','switch tab by position'],
  ['R','refresh the state now'],
  ['T','switch theme'],
  ['?','this panel'],
  ['Esc','close anything open'],
];
function showHelp(){
  lastFocus=document.activeElement; document.getElementById('btnHelp').setAttribute('aria-expanded','true');
  document.getElementById('helpBody').innerHTML=KEYS.map(k=>
    '<div class="krow"><span>'+esc(k[1])+'</span><kbd>'+esc(k[0])+'</kbd></div>').join('');
  document.getElementById('help').classList.add('on');
}
document.addEventListener('keydown',e=>{
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); return; }
  if(e.key==='Escape'){ if(document.getElementById('pal').classList.contains('on')) closePal(); if(document.getElementById('help').classList.contains('on')) { document.getElementById('help').classList.remove('on'); document.getElementById('btnHelp').setAttribute('aria-expanded','false'); if(lastFocus) { lastFocus.focus(); lastFocus=null; } } if(typing)e.target.blur(); return; }
  if(typing) return;
  if(document.getElementById('pal').classList.contains('on')){
    if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(palSel+1,Math.min(palItems.length,40)-1); palPaint(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(palSel-1,0); palPaint(); }
    if(e.key==='Enter'){ e.preventDefault(); if(palItems[palSel]){palItems[palSel].go();} closePal(); }
    return;
  }
  if(e.key==='?'){ showHelp(); return; }
  if(e.key.toLowerCase()==='a'){ active='ai'; render(); return; }
  if(e.key.toLowerCase()==='r'){ poll(); return; }
  if(e.key.toLowerCase()==='t'){ toggleTheme(); return; }
  const idx='1234567890-'.indexOf(e.key);
  if(idx>=0 && idx<TABS.length){ active=TABS[idx][0]; render(); }
});
function toggleTheme(){
  const h=document.documentElement, now=h.getAttribute('data-theme');
  h.setAttribute('data-theme', now==='obsidian'?'paper':'obsidian');
  try{ localStorage.setItem('optimus-theme', h.getAttribute('data-theme')); }catch(e){}
  /* The glyph is a Tabler font class now, so the theme switch swaps the class
     rather than writing path data into the element. */
  const ti=document.getElementById('themeIcon');
  if(ti) ti.className='ti hicon '+(now==='obsidian'?'ti-sun':'ti-moon');
}
document.getElementById('btnPal').onclick=openPal;
document.getElementById('btnHelp').onclick=showHelp;
document.getElementById('btnTheme').onclick=toggleTheme;
document.getElementById('btnAsk').onclick=()=>{ active='ai'; render(); };
document.getElementById('help').onclick=e=>{ if(e.target.id==='help') { e.currentTarget.classList.remove('on'); document.getElementById('btnHelp').setAttribute('aria-expanded','false'); if(lastFocus) { lastFocus.focus(); lastFocus=null; } } };
document.getElementById('pal').onclick=e=>{ if(e.target.id==='pal') closePal(); };
document.getElementById('palIn').oninput=palBuild;
try{ const t=localStorage.getItem('optimus-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

/* The nav sticks directly beneath the header, but the header WRAPS at the
   narrow breakpoint - it measures 106.8px tall there, not 64px. Any fixed
   value in CSS lets the nav slide underneath it the moment you scroll. So the
   offset is measured from the real element instead of assumed, and re-measured
   on resize and on a slow tick (which also catches the icon webfont landing
   and changing the box). */
function syncHeaderHeight(){
  const h=document.querySelector('header');
  if(h) document.documentElement.style.setProperty('--header-h', h.getBoundingClientRect().height+'px');
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
setInterval(syncHeaderHeight, 1000);

/* Entrance animations play exactly once. Without this the 5 s poll would
   re-trigger them on every re-render and the page would pulse forever. */
document.body.classList.add('booting');
setTimeout(function(){ document.body.classList.remove('booting'); }, 900);

/* =============================== BOOT =================================
   Polling, not SSE. I built the /api/stream endpoint and measured it: under
   PowerShell's HttpListener the response headers are never flushed early, so
   EventSource never fires onopen - 55 s of waiting produced nothing. curl saw
   body bytes only because it reads until close. A live feed that silently never
   activates is worse than an honest 5s poll, so the stream route is gone and
   the data age beside the clock tells you how fresh you are. */
if(fileProtocolGuard()){
  /* do not poll: every request would fail for the same structural reason */
}else{
  /* Deep-link entry: #fabric opens Fabric. Guarded on the id actually existing,
     so a stale or hand-typed hash falls back to Overview instead of a blank
     panel - there is no view function for a name that is not in TABS. */
  (function(){
    const h=location.hash.slice(1);
    if(h && TABS.some(t=>t[0]===h)) active=h;
  })();
  window.addEventListener('hashchange', function(){
    const h=location.hash.slice(1);
    if(h && TABS.some(t=>t[0]===h) && h!==active){ active=h; render(); }
  });
  skeleton(); poll();
  setInterval(poll, 5000);
}
