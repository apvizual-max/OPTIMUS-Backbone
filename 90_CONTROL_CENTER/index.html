<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniMax OPTIMUS Control Center</title>
<style>
/* ==========================================================================
   DESIGN SOT: Hermes "Obsidian Telemetry Dark" (Living Master SOT)
   Source (NEVER touch): ~\AppData\Local\hermes\desktop-plugins\design-system
   Read-only copy: projects\95_DESIGN_SOT\      Skill: mavis-hermes-design-sot

   Invariants obeyed:
     max 3 font families | single-shade elevation | 3px left chromatic accent
     18/22px negative space | no boxes inside boxes | Rule 07 border
     disappearance | action cockpit: button on TOP, text UNDERNEATH
   ========================================================================== */
:root{
  --cyan:#22d3ee;   --emerald:#34d399; --purple:#c084fc;  --amber:#fbbf24;
  --pink:#f472b6;   --blue:#60a5fa;    --orange:#fb923c; --indigo:#818cf8;
  --st-active:#ef4444; --st-ok:#22c55e; --st-paused:#eab308;
  --st-waiting:#f97316; --st-done:#9ca3af; --st-wait:#06b6d4; --st-cleared:#6b7280;
  --bg:#05070a; --surface:rgba(18,20,26,.78); --surface-soft:rgba(255,255,255,.028);
  --shadow:0 4px 16px rgba(0,0,0,.25);
  --sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;
  --display:'Trebuchet MS',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sp:8px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="paper"]{
  --bg:#eef1f5; --surface:rgba(255,255,255,.88); --surface-soft:rgba(15,23,42,.045);
  --shadow:0 4px 16px rgba(15,23,42,.10);
  --ink:#16202e; --ink2:#4a5a6e; --ink3:#7b8a9d;
}
html[data-theme="obsidian"]{ --ink:#dbe4ee; --ink2:#8fa0b3; --ink3:#6b7a8d; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 12px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(900px 500px at 12% -8%, rgba(34,211,238,.07), transparent 60%),
             radial-gradient(760px 420px at 92% 0%, rgba(192,132,252,.06), transparent 60%);
}
html[data-theme="paper"] body::before{opacity:.5}
::selection{background:rgba(34,211,238,.28)}

/* ------------------------------------------------------------------ icons */
.ic{width:1em;height:1em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
.card h2 .ic{margin-right:7px;opacity:.95}
.hicon{width:15px;height:15px}

/* ----------------------------------------------------------------- header */
header{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:16px; padding:12px 24px 11px;
  background:linear-gradient(180deg,rgba(18,20,26,.94),rgba(18,20,26,.78));
  backdrop-filter:blur(12px); box-shadow:var(--shadow);
}
html[data-theme="paper"] header{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.82))}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{margin:0;font:700 13.5px/1.2 var(--display);letter-spacing:.15em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.brand h1 b{color:var(--cyan);font-weight:700}
.brand span{font:400 10.5px/1.2 var(--sans);color:var(--ink3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;
  border-radius:6px;border:1px solid var(--surface-soft);background:rgba(255,255,255,.04);
  color:var(--ink2);font:600 11px/1 var(--sans);cursor:pointer;white-space:nowrap;
  transition:background .15s var(--ease),color .15s var(--ease),transform .12s var(--ease);
}
.ibtn:hover{background:rgba(255,255,255,.09);color:var(--ink);transform:translateY(-1px)}
.ibtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ibtn kbd{font:400 10px/1 var(--mono);color:var(--ink3);border:1px solid var(--surface-soft);border-radius:3px;padding:2px 4px}
.live{display:flex;align-items:center;gap:7px;font:400 10.5px/1 var(--mono);color:var(--ink2);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--st-ok);box-shadow:0 0 8px rgba(34,197,94,.55);animation:pulse 2.6s var(--ease) infinite}
.live .dot.stale{background:var(--st-paused);box-shadow:0 0 8px rgba(234,179,8,.55)}
.live .dot.down{background:var(--st-active);box-shadow:0 0 8px rgba(239,68,68,.55);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* -------------------------------------------------------------------- nav */
nav{display:flex;gap:3px;padding:8px 18px;overflow-x:auto;position:sticky;top:52px;z-index:25;
    background:var(--surface-soft);backdrop-filter:blur(8px)}
nav button{
  position:relative;background:transparent;border:0;cursor:pointer;color:var(--ink3);
  font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;
  padding:9px 13px 8px;border-radius:7px;white-space:nowrap;display:flex;align-items:center;gap:7px;
  transition:color .15s,background .15s;
}
nav button:hover:not(:disabled){color:var(--ink);background:rgba(255,255,255,.05)}
nav button.on{color:var(--ink);background:rgba(255,255,255,.07)}
nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
nav button.on::after{content:'';position:absolute;left:11px;right:11px;bottom:2px;height:2px;border-radius:2px;
  background:var(--pill,var(--cyan));box-shadow:0 0 8px var(--pill,var(--cyan))}
nav button:disabled{cursor:not-allowed;opacity:.5}

/* ------------------------------------------------------------------ main */
main{position:relative;z-index:1;padding:24px 24px 60px;max-width:1560px;margin:0 auto}
.pagehead{margin:0 0 20px;padding-left:20px;border-left:3px solid var(--acc,var(--cyan))}
.pagehead h2{margin:0 0 5px;font:700 13.5px/1.2 var(--display);letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:9px}
.pagehead h2 .ic{color:var(--acc);width:15px;height:15px}
.pagehead p{margin:0;max-width:82ch;color:var(--ink2)}
.pagehead .hint{margin-top:6px;color:var(--ink3);font-size:11px;font-style:italic;max-width:82ch}

/* hero KPI band */
.hero{
  display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  background:var(--surface-soft);border-radius:6px;overflow:hidden;margin-bottom:20px;
  box-shadow:var(--shadow);
}
.hero > div{background:var(--surface);padding:16px 18px 15px 20px;border-left:3px solid var(--h,var(--indigo))}
.hero .lab{display:flex;align-items:center;gap:7px;font:700 9.5px/1 var(--display);
  letter-spacing:.11em;text-transform:uppercase;color:var(--h);margin-bottom:9px}
.hero .val{font:800 25px/1 var(--mono);color:var(--ink);letter-spacing:-.01em}
.hero .sub{font:400 10.5px/1.4 var(--mono);color:var(--ink3);margin-top:6px}

.grid{display:grid;gap:20px 28px;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));align-items:start}
.card{
  position:relative;background:var(--surface);border:0;
  border-left:3px solid var(--acc,var(--indigo));border-radius:4px;
  padding:17px 19px 17px 21px;box-shadow:var(--shadow);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.32)}
.card > h2{margin:0 0 3px;font:700 11.5px/1.25 var(--display);letter-spacing:.11em;
  text-transform:uppercase;color:var(--acc,var(--ink2));display:flex;align-items:center;gap:8px}
.card > .sub{margin:0 0 12px;font:400 11px/1.5 var(--sans);color:var(--ink2);
  padding-bottom:10px;border-bottom:1px solid rgba(127,127,127,.16)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:5px 0}
.kv > span:first-child{color:var(--ink2);flex:0 0 auto;display:flex;align-items:center;gap:6px}
.kv > span:first-child .ic{width:12px;height:12px;opacity:.7}
.kv > span:last-child{font:400 11.5px/1.4 var(--mono);color:var(--ink);text-align:right;word-break:break-word;min-width:0}
.kv.sect{padding-top:11px}
.kv.sect > span:first-child{font:700 9.5px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.note{margin-top:10px;padding:9px 12px;border-radius:4px;background:rgba(251,191,36,.10);
  color:#e0bd76;font:400 11px/1.5 var(--sans);display:flex;gap:8px;align-items:flex-start}
.note .ic{margin-top:1px;flex:0 0 auto}
.note.info{background:rgba(96,165,250,.10);color:#8fb8e6}
.note.bad{background:rgba(239,68,68,.11);color:#eb969b}
.ok{color:var(--st-ok)} .warn{color:var(--st-paused)} .bad{color:var(--st-active)} .dim{color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font:400 10.5px/1 var(--mono);padding:5px 9px;border-radius:4px;background:rgba(127,127,127,.13);color:var(--ink2)}
.scroll{max-height:430px;overflow:auto;border-radius:4px;background:rgba(0,0,0,.22);padding:2px 8px}
html[data-theme="paper"] .scroll{background:rgba(15,23,42,.04)}
table{width:100%;border-collapse:collapse;font:400 11px/1.5 var(--mono)}
th{text-align:left;padding:8px 9px;color:var(--ink3);font:700 9.5px/1.3 var(--display);
  letter-spacing:.09em;text-transform:uppercase;position:sticky;top:0;background:var(--surface)}
td{padding:6px 9px;color:var(--ink);border-top:1px solid rgba(127,127,127,.14)}
tr:hover td{background:rgba(127,127,127,.08)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:9px}
.spark i{flex:1 1 auto;background:var(--acc,var(--cyan));border-radius:1px 1px 0 0;opacity:.75;min-height:2px}

/* ============================== ACTION COCKPIT ========================== */
.cockpit{display:flex;flex-wrap:wrap;gap:24px 28px;margin:4px 0 0}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:210px;text-align:left;
  background:none;border:0;padding:0;cursor:pointer;font:inherit}
.act .btn{width:100%;padding:10px 13px;border-radius:5px;cursor:pointer;
  font:700 11px/1.25 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
  background:rgba(127,127,127,.10);border:1px solid rgba(127,127,127,.18);box-shadow:var(--shadow);
  transition:transform .12s var(--ease),background .12s var(--ease)}
.act:hover .btn{background:rgba(127,127,127,.18);transform:translateY(-1px)}
.act:focus-visible .btn{outline:2px solid var(--cyan);outline-offset:2px}
.act .btn.run{opacity:.5;pointer-events:none}
.act .t{font:700 11px/1.3 var(--display);letter-spacing:.04em;color:var(--ink)}
.act .d{font:400 10.5px/1.45 var(--sans);color:var(--ink2)}
.act .cmd{font:400 9.5px/1.35 var(--mono);color:var(--ink3);word-break:break-all}
pre.out{background:rgba(0,0,0,.34);border:0;border-radius:4px;padding:15px 17px;max-height:460px;
  overflow:auto;margin:14px 0 0;font:400 11px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
html[data-theme="paper"] pre.out{background:rgba(15,23,42,.05)}

/* ================================ AI ANALYST ============================= */
.ai{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.aiq{width:100%;padding:13px 14px;border-radius:5px;border:1px solid rgba(127,127,127,.22);
  background:rgba(0,0,0,.26);color:var(--ink);font:400 12.5px/1.5 var(--sans);resize:vertical;min-height:74px}
html[data-theme="paper"] .aiq{background:rgba(255,255,255,.7)}
.aiq:focus{outline:2px solid var(--cyan);outline-offset:1px}
.aiq::placeholder{color:var(--ink3)}
aibr{display:flex;gap:9px;justify-content:flex-end;align-items:center}
.pillbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:5px;cursor:pointer;
  font:700 11px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border:0;
  background:var(--cyan);color:#05222a;box-shadow:var(--shadow);transition:transform .12s var(--ease),filter .12s}
.pillbtn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.pillbtn:disabled{opacity:.5;pointer-events:none}
.pillbtn.ghost{background:rgba(127,127,127,.12);color:var(--ink2);border:1px solid rgba(127,127,127,.2);box-shadow:none}
.aiout{background:var(--surface);border-left:3px solid var(--purple);border-radius:4px;
  padding:18px 20px 18px 22px;box-shadow:var(--shadow);font:400 12.5px/1.65 var(--sans);
  white-space:pre-wrap;color:var(--ink)}
/* The answer panel is the payoff of the whole console, so it carries its own
   provenance: which model answered, how old the facts it reasoned over are, and
   the question that was asked. An answer with no provenance is a claim, and
   this console's entire argument is that every number is measured - so the
   measurement has to travel with the conclusion. The staleness flag turns amber
   rather than disappearing, because a correct answer from a stale snapshot is
   still a stale answer. */
.aihead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.aimodel{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);
  letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.aifacts,.aiwhen{display:inline-flex;align-items:center;gap:5px;font:400 11px/1 var(--sans);
  color:var(--dim);padding:3px 8px;border:1px solid var(--line);border-radius:99px}
.aifacts.warn{color:var(--st-warn);border-color:color-mix(in srgb,var(--st-warn) 45%,transparent)}
.aiq-echo{margin:0 0 12px;padding:9px 12px;border-radius:4px;background:var(--surface-2);
  border-left:2px solid var(--line);font:400 12px/1.5 var(--sans);color:var(--ink-2)}
.aiq-echo::before{content:'asked: ';color:var(--dim);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase}
/* The incidents list is a reference, not the headline. Uncapped it ran to
   ~1075px and dictated the height of its entire grid row, leaving ~800px of
   empty card on either side. Capped, the newest entries are visible and the
   rest is one scroll away. */
.incroll{max-height:420px;overflow-y:auto;margin-top:2px;padding-right:6px}
.incroll::-webkit-scrollbar{width:7px}
.incroll::-webkit-scrollbar-track{background:transparent}
.incroll::-webkit-scrollbar-thumb{background:rgba(127,127,127,.28);border-radius:99px}
.incroll::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.45)}
.aiout.pending{color:var(--ink3);font-style:italic}
/* A 5+1 wrap left one orphan on its own row and read as a mistake rather than
   a layout. Six chips in three even columns is balanced at any width, and the
   columns collapse rather than re-orphan on a narrow screen. */.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:1100px){.qs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.qs{grid-template-columns:1fr}}
.qs button{padding:7px 12px;border-radius:20px;border:1px solid rgba(127,127,127,.22);
  background:rgba(127,127,127,.08);color:var(--ink2);cursor:pointer;
  font:400 11px/1.35 var(--sans);transition:background .14s,color .14s,border-color .14s}
.qs button:hover{background:rgba(192,132,252,.16);color:var(--ink);border-color:rgba(192,132,252,.42)}
.qs button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* command palette */
.pal{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);padding:14vh 20px 0}
.pal.on{display:block}
.palbox{background:var(--surface);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  max-width:640px;margin:0 auto;overflow:hidden;border-left:3px solid var(--cyan)}
.palin{width:100%;padding:16px 18px;border:0;background:transparent;color:var(--ink);
  font:400 14px/1.4 var(--sans);border-bottom:1px solid rgba(127,127,127,.16)}
.palin:focus{outline:none}
.pallist{max-height:46vh;overflow:auto}
.palrow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 18px;border:0;background:none;
  color:var(--ink2);cursor:pointer;text-align:left;font:400 12px/1.4 var(--sans)}
.palrow:hover,.palrow.sel{background:rgba(127,127,127,.13);color:var(--ink)}
.palrow .ic{color:var(--cyan);width:14px;height:14px}
.palrow .k{margin-left:auto;font:400 10px/1 var(--mono);color:var(--ink3)}
.palfoot{padding:9px 18px;border-top:1px solid rgba(127,127,127,.14);display:flex;gap:16px;
  font:400 10px/1 var(--mono);color:var(--ink3)}

.ovl{position:fixed;inset:0;z-index:110;display:none;background:rgba(0,0,0,.7);padding:12vh 20px 0}
.ovl.on{display:block}
.ovlbox{background:var(--surface);border-radius:8px;max-width:560px;margin:0 auto;padding:22px 24px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);border-left:3px solid var(--indigo)}
.ovlbox h3{margin:0 0 14px;font:700 12px/1 var(--display);letter-spacing:.11em;
  text-transform:uppercase;color:var(--indigo)}
.krow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid rgba(127,127,127,.1)}
.krow:last-child{border:0}
.krow span:first-child{color:var(--ink2)}
.krow kbd{font:400 10.5px/1 var(--mono);color:var(--ink);background:rgba(127,127,127,.14);
  border-radius:4px;padding:4px 7px}
a.link{display:inline-block;margin-top:12px;padding:11px 17px;border-radius:5px;
  background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.36);color:var(--cyan);
  text-decoration:none;font:700 12px/1 var(--mono)}
.bar{height:3px;background:rgba(127,127,127,.15);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:60%;background:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.5);
  animation:load 1.4s var(--ease) infinite}
@keyframes load{0%{margin-left:-60%}100%{margin-left:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
  header{flex-wrap:wrap;gap:9px;padding:10px 14px}
  .brand span{display:none}
  main{padding:16px 14px 48px}
  .grid{grid-template-columns:1fr;gap:16px}
  .act{width:100%}
  .cockpit{gap:16px}
}
</style>

<!-- ═══════════════════════════════════════════════════════════════════════
     PASS 1-8 — SCALE FOUNDATION  (Ralph Loop, 2026-10-03)
     Additive layer. Nothing above is edited or removed; these rules land
     later in the cascade and win at equal specificity.

     Grounded in research, not taste:
       - body was 12px. Five independent sources put the floor at 14-16px
         and 16px as the comfortable desktop default.
       - modular scale 1.25 (Major Third), 7 steps, per the type-scale guides.
       - line-height never below 1.4 in body text; 1.6 here.
       - measure capped 45-75ch. This file used 82ch — over the long end.
       - enterprise dashboard baseline is a 1440px monitor, so 1920 must be
         used deliberately rather than left as leftover margin.
     ═══════════════════════════════════════════════════════════════════ -->
<style id="pass-1-8-scale">
:root{
  /* --- modular scale, ratio 1.25 -------------------------------------- */
  --t-xs:11px;   --t-sm:12.5px; --t-base:15px; --t-md:15px;
  --t-lg:17px;   --t-xl:19px;   --t-2xl:24px;  --t-3xl:30px;  --t-4xl:38px;
  --lh-body:1.6;
  --measure:72ch;
  --header-h:64px;
  --r-sm:6px; --r-md:9px; --r-lg:12px;
  --ic:19px;         /* base icon box  */
  --ic-sm:14px;
  --ic-lg:23px;
  --elev-1:0 2px 8px rgba(0,0,0,.22);
  --elev-2:0 6px 18px rgba(0,0,0,.28);
  --elev-3:0 12px 34px rgba(0,0,0,.38);
  --ring:0 0 0 3px rgba(34,211,238,.30);
}
html[data-theme="paper"]{
  --elev-1:0 2px 8px rgba(15,23,42,.07);
  --elev-2:0 6px 18px rgba(15,23,42,.11);
  --elev-3:0 12px 34px rgba(15,23,42,.16);
}

/* 1 — base text. The single biggest legibility win on the whole page. */
body{ font:400 var(--t-base)/var(--lh-body) var(--sans); }

/* 2 — icon boxes follow the type scale */
.ic{width:1em;height:1em;stroke-width:1.6}
.hicon{width:var(--ic-sm);height:var(--ic-sm)}

/* 3 — header grows, so the nav's hard-coded sticky offset must grow with it */
header{
  padding:12px 30px; gap:20px; min-height:var(--header-h);
  background:linear-gradient(180deg,rgba(18,20,26,.96),rgba(18,20,26,.80));
}
.brand h1{font-size:var(--t-xl);letter-spacing:.13em}
.brand span{font-size:var(--t-sm);margin-top:3px}
.ibtn{height:40px;padding:0 15px;font-size:var(--t-sm);border-radius:var(--r-sm);gap:9px}
.ibtn kbd{font-size:11.5px;padding:3px 6px}

body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:

    linear-gradient(90deg, rgba(127,127,127,.045) 1px, transparent 1px);

     shadow and a hairline top highlight rather than by nested borders. */
.card{

  transition:transform .18s var(--ease), box-shadow .18s var(--ease),

     a full scroll to read what is meant to be a status board. The cap sits well
     above the tallest legitimate card measured (~640px), so ordinary cards are
     untouched and only runaway ones engage - and then they scroll internally.
     Long prose belongs in the documentation; capping it keeps the information
     without pretending the whole page is glanceable. */
  max-height:1000px; overflow-y:auto;}
.card:hover{
  transform:translateY(-3px);

     already present on some controls and is now consistent everywhere. */

}

/* 23 — motion. Short, eased, and never on a value the eye has to read. */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
/* Entrance animation runs ONCE, on first paint only.
   render() is also called by the 5 s poll, which replaces #view wholesale, so
   an unscoped animation here replays every single cycle: the page visibly faded
   out and back in every five seconds while you were reading it (opacity was
   measured dipping to 0). `booting` is added on load and removed after the
   first paint, so the delight happens once instead of forever. */

body.booting .grid > .card{animation:riseIn .40s var(--ease) both}
body.booting .hero > div{animation:riseIn .36s var(--ease) both}

body.booting .hero > div:nth-child(2),body.booting .grid > .card:nth-child(2){animation-delay:.05s}
body.booting .hero > div:nth-child(3),body.booting .grid > .card:nth-child(3){animation-delay:.08s}
body.booting .hero > div:nth-child(4),body.booting .grid > .card:nth-child(4){animation-delay:.11s}
body.booting .hero > div:nth-child(5),body.booting .grid > .card:nth-child(5){animation-delay:.14s}
body.booting .hero > div:nth-child(6),body.booting .grid > .card:nth-child(6){animation-delay:.17s}
body.booting .grid > .card:nth-child(7),body.booting .grid > .card:nth-child(8){animation-delay:.20s}
body.booting .grid > .card:nth-child(9){animation-delay:.23s}

  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;

<script>
/* ============================== ICONS ==================================== */

const svg = (k, cls) => `<svg class="ic ${cls||''}" viewBox="0 0 24 24">${IC[k]||IC.gauge}</svg>`;

/* ── Tabler Icons 3.48.0 (MIT), 5229 glyphs on one 24px grid ───────────────
   Research picked Tabler for dashboards specifically: largest consistent
   outline set, so the UI does not end up mixing icon styles. Every class name
   below was verified present in the shipped stylesheet. Six obvious guesses
   were NOT and would have rendered as blank boxes:
     ti-bridge, ti-layers, ti-info, ti-play, ti-cpu-core, ti-waves
   Real substitutes used instead: ti-affiliate, ti-stack-2, ti-help-circle,
   ti-player-play, ti-activity.
   The original hand-drawn IC map above is untouched and still used for the
   in-card key/value glyphs, so nothing that used to render stops rendering. */
const TIC = {
  gauge:'gauge', boxes:'box-multiple', bridge:'affiliate', plug:'plug',
  brain:'brain', refresh:'refresh', sparkle:'sparkles', layers:'stack-2',
  doc:'file-text', terminal:'terminal', warn:'alert-triangle',
  check:'circle-check', x:'circle-x', server:'server', key:'key',
  download:'download', play:'player-play', clock:'clock', file:'file',
  cpu:'cpu', lock:'lock',
  info:'help-circle', search:'search', moon:'moon', sun:'sun',
  keyboard:'keyboard', chart:'chart-line', activity:'activity',
  heartbeat:'heartbeat', shield:'shield-check', bolt:'bolt', rocket:'rocket',
  copy:'copy', printer:'printer', palette:'palette', hexagon:'hexagon',
  wand:'wand', topology:'topology-star-3', antenna:'antenna',
  docker:'brand-docker', world:'world', building:'building', flame:'flame',
  zoom:'zoom', filter:'filter', external:'external-link',
  tree:'binary-tree', star:'star', point:'point', api:'api', code:'code',
  alert:'alert-circle', filter2:'filter', settings:'settings',
};
const tic = (k, cls) => `<i class="ti ti-${TIC[k]||TIC.gauge} ${cls||''}"></i>`;

/* ============================== TABS ==================================== */
const TABS = [
  ['overview','Overview','indigo','gauge','The one-screen answer to "is OPTIMUS healthy right now?"','Reads the same live snapshot as every other tab. If a number here disagrees with its own tab, that tab is more detailed.'],
  ['ai','AI Analyst','purple','brain','Ask the system anything. MiniMax-M3 answers from the live measurement, not from memory.','The facts are pre-digested before the model sees them, so it quotes exact values and refuses to guess. Nothing here is a canned response.'],
  ['trends','Trends & Incidents','orange','clock','What changed, when it changed, and what looks wrong against its own recent history','A snapshot cannot answer "when did it break". This tab is built from a server-side history, so it can. Median baselines, not averages, so one spike cannot hide behind itself.'],
  ['docker','Docker','emerald','boxes','Every container OPTIMUS runs, grouped by the compose project that owns it','Herds are the risk. hermes-mcp-* is load-bearing and must never be pruned; the apviz project is guarded by `cc guard`. Click any row for its full record.'],
  ['bridges','Bridges','cyan','bridge','The two MiniMax bridges connecting Mavis to Hermes and Antigravity','Each line is one diagnostic check: ok means verified, warn needs a human eye, fail means act. The usual warns are expected.'],
  ['services','Services','blue','plug','The supporting applications OPTIMUS depends on, and whether they answer','Stirling-PDF is a real HTTP API. LibreOffice on 3001 is a remote desktop, not an API - convert with `optimus doc convert`.'],
  ['qwen','Qwen','purple','sparkle','Qwen Studio: transport, credentials, and the reason prompts fail today','Qwen speaks ACP, not MCP. The blocker is the model provider, not the protocol.'],
  ['update','Hermes Update','amber','refresh','Hermes self-updates, so this state moves on its own. Here is where it stands','Also detects the self-inflicted deadlock where a hung CLI process owns the update lock it is waiting on.'],
  ['minimax','MiniMax','pink','sparkle','The MiniMax ecosystem: Code, Design, and the CLI that runs on the Code binary','There is no separate MiniMax CLI product. This tab proves it, and shows the live Python route to the same models.'],
  ['skills','Skills','orange','layers','The skill libraries Mavis can load, and the source-of-truth index behind them','Skills are the reusable procedures. 60_SKILLS\\_links junctions every library so you can browse them in one place.'],
  ['projects','Projects Sections','indigo','file','The documents folder acting as OPTIMUS\'s central audit point','File, folder and byte counts per section, measured live on every poll.'],
  ['docs','Documentation','blue','doc','The root documents, newest first','OPTIMUS_CURRENT_STATE.md is generated from live measurement and always wins. Everything else is dated history.'],
  ['command','Command Center','cyan','terminal','Every action the dashboard can take, with what it does and what it prints','Buttons run on this machine and print their real output below. Nothing is simulated.'],
  ['resilience','Resilience','emerald','heartbeat','Whether this console is genuinely being kept alive, and what staying up has cost','A supervisor checks every 30 s whether the server serves FRESH state, not merely whether the port is open. A listening socket is not proof of health: a wedged process holds one open indefinitely while everything behind it rots. That is exactly how this dashboard sat dead for 19.5 hours before the supervisor existed.'],
  ['fabric','Fabric','cyan','topology','Every dependency as one grid: who answers, who watches, and what happens if each one dies','A reachability board and a supervision tree. The question a dashboard is supposed to answer is not "what is the number" but "what happens to everything else when this one thing stops" — so the graph is drawn with its failure consequences, not just its states.'],
];

/* ============================== ACTIONS ================================= */
const ACTIONS = {
  status:        {t:'Full status',        d:'One-screen health of every pillar. Start here when something looks wrong.',                    c:'optimus status', i:'gauge'},
  doctor:        {t:'Deep doctor',        d:'Every diagnostic check from both bridges, including the slow ones.',                           c:'optimus doctor --deep', i:'check'},
  census:        {t:'Docker census',      d:'Container counts by group, and the standing warning about pruning.',                              c:'optimus docker census', i:'boxes'},
  bridge_health: {t:'Bridge health',      d:'Liveness of the two MiniMax bridges and how long each has been up.',                       c:'optimus bridge health', i:'bridge'},
  sot_list:      {t:'Show SOT links',     d:'Lists every junction and hard link behind the source-of-truth index.',                        c:'optimus sot list', i:'layers'},
  skills:        {t:'List Mavis skills',  d:'Names of every skill Mavis can load right now.',                                               c:'optimus skills list', i:'layers'},
  qwen_status:   {t:'Qwen status',        d:'Daemon, stored OAuth credential, and the Ollama dependency.',                                c:'optimus qwen status', i:'sparkle'},
  compose_check: {t:'Validate compose',   d:'Confirms docker-compose.yml is present and parses. Never stops a container.',                   c:'docker compose -f C:\\Users\\apviz\\docker-compose.yml config --quiet', i:'check'},
  app_status:    {t:'MiniMax apps',       d:'Whether Code and Design are installed, and whether Code is running for the CLI broker.',      c:'optimus app status', i:'plug'},
  ai_auth:       {t:'MiniMax CLI auth',   d:'The shared auth broker status. Only authenticated while MiniMax Code is running.',              c:'mcode-tools auth status', i:'key'},
  ai_tools:      {t:'Connector tools',    d:'The full catalogue of connected App/Connector tools available to MiniMax.',                    c:'mcode-tools connector tools', i:'cpu'},
  qwen_doctor:   {t:'Qwen ACP doctor',    d:'Three-layer Qwen diagnosis: transport, session, and model provider.',                         c:'optimus qwen doctor', i:'sparkle'},
  state_doc:     {t:'Rebuild state doc',  d:'Regenerates OPTIMUS_CURRENT_STATE.md from a fresh measurement so it cannot go stale.',  c:'scripts\\build-current-state.ps1', i:'file'},
  mojibake:      {t:'Check doc encoding', d:'Dry-run scan of every markdown file for double-encoded characters. Reports, changes nothing.', c:'scripts\\repair-mojibake.ps1 -Recurse', i:'doc'},
  journal:       {t:'Bridge journal',     d:'Reads the audit trail the bridges already write, straight from the container.', c:'docker exec minimax-hermes-bridge tail /opt/optimus/journal/', i:'file'},
};

const SUGGESTED = [
  'What is the state of the system right now?',
  'Is anything actually broken? What exactly?',
  'Which single thing should I fix first?',
  'Why would qwen_prompt fail?',
  'Which bridge has warnings, and why?',
  'Is the Hermes source tree healthy?',
];

let S = null, active = 'overview', busy = false, history = [];

/* Action output has to survive the 5 s poll. poll() -> render() rebuilds #view,
   so any element reference captured by bind() is stale by the time an action's
   fetch resolves, and the result is written into a detached node where no one
   can ever see it. The poll also reset the visible region to its placeholder.
   Keep the text here and always write through a fresh lookup instead. */
let outKeep = '';

const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!==undefined) e.innerHTML=h; return e; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* PowerShell collapses a ONE-element array to a scalar on the way through JSON.
   Every list in this payload is therefore untrusted as an array - a single
   bridge, a single check, a single doc, a single container all arrive as bare
   objects and `.map` is not a function.

   It must also NOT wrap a collection as a scalar: Array.isArray() is false for
   a NodeList or an HTMLCollection, so the first version wrapped querySelectorAll
   results as one element and getComputedStyle threw. Length-bearing,
   non-string values are therefore spread; everything else is one value. */
const arr = v => (v==null) ? []
  : Array.isArray(v) ? v
  : (typeof v!=='string' && typeof v.length==='number') ? Array.prototype.slice.call(v)
  : [v];
/* yn() returns markup; kv() deliberately does NOT escape its value so markup
   renders. Values come from our own /api/state, never from user input. */
const yn = (b,t,f) => b ? `<span class="ok">${esc(t||'yes')}</span>` : `<span class="bad">${esc(f||'no')}</span>`;
const kv = (k,v,c) => `<div class="kv"><span>${k}</span><span class="${c||''}">${v==null?'':v}</span></div>`;
const sect = k => `<div class="kv sect"><span>${esc(k)}</span><span></span></div>`;
const note = (h,k) => `<div class="note ${k||''}">${tic(k==='bad'?'warn':(k==='info'?'info':'alert'))}<span>${h}</span></div>`;
const clip = (s,n) => { s=String(s==null?'':s); return s.length<=n?s:s.slice(0,n)+' …['+(s.length-n)+' chars]'; };
const httpJson = (u,t) => fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);

/* ========================== file:// guard =============================== */
function fileProtocolGuard(){
  if (location.protocol !== 'file:') return false;
  const target='http://127.0.0.1:8900/';
  setStatus('opened as a file - not a valid origin','down');
  document.getElementById('view').innerHTML =
    '<div class="card" style="--acc:var(--amber)"><h2>'+svg('warn')+'Wrong way to open</h2>'+
    '<p class="sub">This page was opened as a local file, so it has no server behind it and can never reach the Control Center API. The server itself may well be running perfectly.</p>'+
    '<div class="note info">'+svg('clock')+'<span>Open it over HTTP instead, and keep using that tab. Double-clicking the file will always fail.</span></div>'+
    '<a class="link" href="'+target+'">&rarr; '+target+'</a>'+
    note('If the link does not work the server is not running. Start it with <code>cc start</code>, then reload.')+'</div>';
  const nav=document.getElementById('nav');
  /* #view carries role="tabpanel" in the markup, so this path has to describe
     its nav the same way the normal path does — otherwise the guard page ships
     a tabpanel that no tab controls, and a screen reader announces a panel with
     no way to reach it. These buttons are disabled and never selected. */
  if(!nav.children.length){
    nav.setAttribute('role','tablist');
    nav.setAttribute('aria-label','Control Center sections');
    TABS.forEach(([id,l,acc,icn])=>{
      const b=el('button','',tic(icn)+esc(l));
      b.disabled=true; b.style.setProperty('--pill',`var(--${acc})`);
      b.id='tab-'+id; b.dataset.tab=id;
      b.setAttribute('role','tab'); b.setAttribute('aria-controls','view');
      b.setAttribute('aria-selected','false');
      nav.appendChild(b);
    });
  }
  return true;
}
function setStatus(t,c){ document.getElementById('ts').textContent=t; document.getElementById('dot').className='dot '+(c||''); }

/* Header status. The clock says how FRESH the data is; these two say whether
   anything is WRONG and whether anything is WATCHING. That distinction was
   missing, and it is the whole point of the Resilience tab existing.
   The risk count is derived from the measurement, never hard-coded, so it
   cannot go stale while still looking reassuring. */
function paintHeader(){
  const risk=document.getElementById('pillRisk'), sup=document.getElementById('pillSup'),
        meta=document.getElementById('sysMeta');
  if(!S||!S.sections){ return; }
  const d=S.sections.docker, b=S.sections.bridges||[], sv=S.sections.services||[],
        q=S.sections.qwen||{}, m=S.sections.minimax||{};

  let problems=[];
  arr(b).forEach(x=>{ if(!x.up) problems.push('bridge '+x.name+' is DOWN');
                 else if(x.fail) problems.push(x.fail+' failing check(s) on '+x.name); });
  arr(sv).forEach(s=>{ if(!s.up) problems.push('service '+s.name+' unreachable'); });
  (d.containers||[]).forEach(c=>{ if(c.status!=='running') problems.push(c.name+' is '+c.status);
                                  else if(c.health && c.health!=='healthy' && c.health!=='none') problems.push(c.name+': '+c.health); });
  if(d.compose_present===false) problems.push('docker-compose.yml is missing');
  else if(d.compose_valid===false) problems.push('docker-compose.yml does not parse');
  if(m.cli_auth && m.cli_auth!=='authenticated') problems.push('MiniMax CLI is '+m.cli_auth);
  if(q.daemon_up===false) problems.push('Qwen ACP daemon is down');

  risk.className='pill p-risk'+(problems.length?' bad':'');
  risk.querySelector('span').textContent = problems.length
    ? (problems.length+' problem'+(problems.length===1?'':'s')+' — click')
    : 'all clear';
  risk.title = problems.length ? problems.join('\n') : 'Nothing failing in the current measurement.';
  risk.onclick = ()=>{ active=(problems.some(p=>p.indexOf('Qwen')===0))?'qwen':'trends'; render(); };

  const s=S.supervision||{};
  sup.className='pill p-ok'+(!s.known?' gone':(s.healthy?'':' bad'));
  sup.querySelector('span').textContent = !s.known ? 'UNSUPERVISED'
      : (s.healthy ? 'supervisor healthy' : 'supervisor restarting');
  sup.title = !s.known ? 'Nothing is watching this server. Run: cc install'
      : (s.restarts+' restart(s) · last check '+(s.state_age_sec==null?'?':Math.round(s.state_age_sec)+'s')+' ago');
  sup.onclick = ()=>{ active='resilience'; render(); };

  const cpu=S.sections.docker&&S.sections.docker.total!=null?S.sections.docker.total:'?';
  meta.textContent = (S.host||'?')+' · port 8900 · '+cpu+' containers · refresh 5s · measured '+
    (S.generated?new Date(S.generated).toLocaleTimeString():'—');
}

/* ============================== POLLING ================================= */
async function poll(){
  if(busy) return; busy=true;
  if(!S){ setStatus('collecting system state','stale'); skeleton(); }
  try{
    S=await httpJson('/api/state');
    if(!S) throw new Error('no state returned');
    const age=Math.max(0,Math.round((Date.now()-new Date(S.generated).getTime())/1000));
    if(S.sections.docker && S.sections.docker.total) history.push(S.sections.docker.total);
    if(history.length>40) history.shift();
    setStatus('live '+new Date(S.generated).toLocaleTimeString()+' · '+age+'s old',
              age<60?'':(age<180?'stale':'down'));
    render();
  }catch(e){
    setStatus('collector unreachable: '+e.message,'down');
    if(!S) document.getElementById('view').innerHTML=
      '<div class="card" style="--acc:var(--st-active)"><h2>'+svg('warn')+'Cannot reach the collector</h2>'+
      '<p class="sub">The Control Center server on 127.0.0.1:8900 is not answering.</p>'+
      note('Start it with <code>cc start</code>, then retry. The dashboard can only show what the collector measured, so there is nothing to display until the server is back.')+
      '<div style="margin-top:14px"><button class="pillbtn" onclick="location.reload()">Retry now</button></div></div>';
  } finally { busy=false; }
}
function skeleton(){

    '<div class="bar"><i></i></div></div>';
}
function pagehead(t){
  /* TABS is [id, label, accent, icon, description, hint].
     This read the DESCRIPTION as the icon key (so it fell back to a gauge),
     printed the HINT as the lead paragraph, and asked for t[6] for the hint -
     which is always undefined, so the real description was never shown. */
  return '<div class="pagehead" style="--acc:var(--'+t[2]+')"><h2>'+tic(t[3])+esc(t[1])+'</h2><p>'+esc(t[4])+'</p>'+
         (t[5]?'<p class="hint">'+esc(t[5])+'</p>':'')+'</div>';
}
function sparkline(vals, acc){
  if(!vals.length) return '';
  const mx=Math.max(...vals), mn=Math.min(...vals), sp=mx-mn||1;
  return '<div class="spark" style="--acc:var(--'+(acc||'cyan')+')" title="container count trend, '+vals.length+' samples">'+
    vals.map(v=>'<i style="height:'+Math.round(28*((v-mn)/sp))+'%"></i>').join('')+'</div>';
}

/* A real area chart instead of a bar strip: gradient fill, stroked line, a
   marker on the latest sample, and a min/mid/max axis line. Composed as raw
   SVG so it adds no dependency and no network round-trip.
   The viewBox scales uniformly (no preserveAspectRatio="none"), which keeps
   the end marker a circle instead of smearing it into an ellipse. */
function areaChart(vals, acc, height){
  /* The first history sample is null - the ring buffer has no previous value to
     diff against on a cold start. Math.min over [null,57,57,57,57] is 0, not
     57, so a series that never moved was drawn as a rise off zero and labelled
     "min 0 / now 57 / +57". Filter to real finite numbers BEFORE any
     arithmetic, or the chart invents history that never happened. */
  const v=(vals||[]).filter(function(x){return typeof x==='number' && isFinite(x)});
  if(v.length < 2) return '<div class="dim chart-empty">not enough history yet &mdash; the baseline builds as samples arrive</div>';
  const W=1000, H=height||280, pad=30;
  const mx=Math.max.apply(null,v), mn=Math.min.apply(null,v);
  const sp=(mx-mn)||1, lo=mn-sp*0.3, hi=mx+sp*0.3, rng=(hi-lo)||1;
  const n=v.length-1;
  const x=i=>pad+(i*(W-pad*2))/n;
  const y=n2=>H-pad-((n2-lo)/rng)*(H-pad*2);
  let line='', area='';
  v.forEach(function(val,i){
    const px=x(i).toFixed(1), py=y(val).toFixed(1);
    line += (i?' L':'M')+px+' '+py;
    area += (i?' L':'M')+px+' '+py;
  });
  area = 'M'+pad+' '+(H-pad)+' L'+area.slice(1)+' L'+x(n).toFixed(1)+' '+(H-pad)+' Z';
  const c='var(--'+(acc||'cyan')+')', gid='ag-'+(acc||'cyan');
  const last=v[n], step=n>0?(last-v[0]):0;
  return '<div class="chart" style="--acc:'+c+'">'
    +'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="trend over '+n+' intervals">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+c+'" stop-opacity=".42"/>'
    +'<stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="rgba(127,127,127,.25)" stroke-width="1"/>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+line+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+x(n).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="6" fill="'+c+'"/>'
    +'<circle cx="'+x(n).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="12" fill="none" stroke="'+c+'" stroke-width="1.5" opacity=".45"/>'
    +'</svg>'
    +'<div class="chart-ax"><span>min <b>'+mn+'</b></span>'
    +'<span>'+v.length+' samples</span>'
    +'<span>now <b>'+last+'</b> '+(step>0?'&#9650; +'+step:(step<0?'&#9660; '+step:'&#9679; flat'))+'</span></div>'
    +'</div>';
}

/* ============================== RENDER ================================= */
function render(){
  const nav=document.getElementById('nav');
  /* These are TABS, and they said so only visually. Fifteen bare <button>s in a
     <nav> carried no role, no selected state and no id, so: a screen reader had
     no way to learn which panel was showing, the active tab was marked by COLOUR
     alone (font-weight was 600 on active and inactive alike), and there was no
     stable handle to link to or script against. All of that is additive. */
  if(!nav.children.length){
    nav.setAttribute('role','tablist');
    nav.setAttribute('aria-label','Control Center sections');
    TABS.forEach(([id,l,acc,icn,desc])=>{
      /* TABS is [id, label, accent, icon, description, hint]. This read index 4
         — the DESCRIPTION — as the icon key, so svg() missed, fell back to
         IC.gauge, and every tab rendered the same gauge glyph. The tooltip had
         the identical off-by-one and showed the hint instead of the blurb. */
      const b=el('button','',tic(icn)+esc(l));
      b.style.setProperty('--pill',`var(--${acc})`);
      b.title=l+' — '+desc;
      b.id='tab-'+id;
      b.dataset.tab=id;
      b.setAttribute('role','tab');
      b.setAttribute('aria-controls','view');
      b.onclick=()=>{ active=id; render(); };
      nav.appendChild(b);
    });
  }
  /* The update pass used to be the `else` of the create branch, so on a COLD load
     the fifteen buttons were built and appended with no class at all, and the
     active tab was not marked until the SECOND render - five seconds later, or
     twenty when a collect is in flight. The nav pointed at nothing for that
     whole window. Creating and marking are now separate steps, so it is right on
     the first paint. */
  [...nav.children].forEach((b,i)=>{
    const on = TABS[i][0]===active;
    b.className = on?'on':'';
    b.setAttribute('aria-selected', on?'true':'false');
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  /* The open tab lives in the URL now, so a console you keep in a bookmark bar -
     or paste into a message to someone - lands on the panel you meant instead of
     Overview. replaceState, not assignment: fifteen poll cycles must not bury the
     Back button under fifteen identical entries. It also does not fire hashchange,
     so this cannot loop against the listener below.

     WINDOW.history, explicitly. There is a top-level `let history = []` further
     up holding the container-count samples, and a `let` at script scope SHADOWS
     the global — so a bare `history.replaceState` was undefined, threw on every
     render, and fell through to the catch below, which assigns location.hash and
     pushes a real history entry per click. The symptom looked fine (the tab still
     switched, Back still worked) which is exactly why it survived: the thing that
     was broken was the thing nothing was measuring. */
  if(location.hash.slice(1)!==active){
    try{ window.history.replaceState(null,'','#'+active); }
    catch(e){ location.hash='#'+active; }
  }
  const tab=TABS.find(t=>t[0]===active)||TABS[0];
  const map={overview:viewOverview, ai:viewAI, trends:viewTrends, docker:viewDocker, bridges:viewBridges,
             services:viewServices, qwen:viewQwen, update:viewUpdate, minimax:viewMinimax,
             skills:viewSkills, projects:viewProjects, docs:viewDocs, command:viewCommand,
             resilience:viewResilience, fabric:viewFabric};
  document.getElementById('view').innerHTML = pagehead(tab) + (map[active]||viewOverview)();
  paintHeader();
  bind();
}

/* ============================== AI ANALYST ============================== */
let aiBusy=false;
/* The answer lives HERE, not in a DOM node. /api/ask takes ~26 s; the 5 s poll
   calls render() and replaces #view wholesale, so any element captured before
   the fetch is detached before the response lands. The old code wrote the
   answer into that detached node and the user saw the placeholder forever -
   the Ask button, the six suggestions and the whole panel were non-functional
   while the API answered correctly underneath. This is postmortem #5, unfixed
   in this path: the outKeep treatment went to the action output and was never
   swept to the analyst. */
let aiAnswer=null;
/* The answer is now produced by a BACKGROUND JOB, so "no answer yet" has two
   distinct meanings and the page must not collapse them: nothing has been
   asked (the placeholder), or a question is in flight (thinking). Rendering
   both as the same placeholder is how a 40-second wait reads as a dead
   button. aiPending is that distinction. */
let aiPending=false;
/* What was asked, and the snapshot the answer was computed against. An answer
   with no question above it is a fortune cookie; an answer with no timestamp
   below it is a claim with no evidence - and this console's whole argument is
   that every number is measured. The answer panel therefore carries both, and
   the freshness is the SAME snapshot the model was handed, not a new read. */
let aiQuestion=null, aiFactsAt=null, aiAt=null;
const AI_PLACEHOLDER='Ask anything about the running system. The answer is a real model response built from the measurement taken at the moment you asked - never from memory.';
const AI_THINKING='Thinking… the console stays live while the model works.';
function aiAnswerInner(){
  return (aiAnswer===null)
    ? '<div class="aiout pending" id="aiOut">'+esc(aiPending?AI_THINKING:AI_PLACEHOLDER)+'</div>'
    : aiHead();
}
function paintAI(){
  // Repaint the ANSWER BOX, not just one node inside it. The provenance header
  // is produced by viewAI(), which askAI does not call - so rewriting only
  // #aiOut left the panel showing a bare answer with no model, no fact-age and
  // no question, until the next 5 s poll happened to rebuild the view. Calling
  // render() instead would have fixed that and destroyed the textarea the
  // operator is still looking at, so the box owns its own content and both
  // paths produce the same thing.
  const box=document.getElementById('aiAns');
  if(box){ box.innerHTML=aiAnswerInner(); return; }
  const el=document.getElementById('aiOut');     // resolve fresh, never capture
  if(!el) return;
  if(aiAnswer===null){
    el.className='aiout pending'; el.textContent=aiPending?AI_THINKING:AI_PLACEHOLDER; return;
  }
  el.className='aiout'; el.textContent=aiAnswer;
}
function aiHead(){
  if(aiAnswer===null) return '';
  const asked = aiQuestion ? esc(aiQuestion) : '';
  const when  = aiAt ? new Date(aiAt).toLocaleTimeString() : '';
  const stale = aiFactsAt ? Math.max(0,Math.round((Date.now()-new Date(aiFactsAt).getTime())/1000)) : null;
  return '<div class="aihead">'
    +'<span class="aimodel">'+svg('sparkle')+'MiniMax-M3</span>'
    +(aiFactsAt?'<span class="aifacts'+(stale>180?' warn':'')+'">'+tic('clock','ti-xs')+'facts measured '+stale+'s ago</span>':'')
    +(when?'<span class="aiwhen">'+tic('check','ti-xs')+'answered '+esc(when)+'</span>':'')
    +'</div>'
    +(asked?'<div class="aiq-echo">'+asked+'</div>':'')
    +'<div id="aiOut" class="aiout">'+esc(aiAnswer)+'</div>';
}
function viewAI(){
  return '<div class="ai">'
   +'<div class="card" style="--acc:var(--purple)"><h2>'+svg('brain')+'Ask the system</h2>'
   /* No second paragraph here. The hero already explains what this is, and a
      near-verbatim repeat underneath it reads as filler - the eye has already
      read the sentence. The space earns better use as the answer surface. */
   +'<textarea class="aiq" id="aiQ" aria-label="AI query input" placeholder="e.g. Which single thing should I fix first?"></textarea>'
   +'<div class="aibr" style="margin-top:11px">'
   +'<button class="pillbtn ghost" id="aiClear">Clear</button>'
   +'<button class="pillbtn" id="aiGo">'+svg('sparkle')+'Ask</button>'
   +'</div>'
   +'<div class="qs" id="aiQs">'+SUGGESTED.map(q=>'<button data-q="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>'
   +'</div>'
   /* esc() here: the answer is model output and this is innerHTML, not
      textContent. The detached-node fix must not introduce an injection.
      The id="aiAns" box is what paintAI() re-renders, so an answer that arrives
      without a page reload still gets its full provenance header. */
   +'<div class="aians" id="aiAns" aria-live="polite">'+aiAnswerInner()+'</div>'
   +'</div>';
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
/* Poll a background job until it reports done or error, and return the result
   object. Shared by the analyst and the action buttons: both are now
   "POST returns an id, GET returns the outcome".

   First poll is immediate, bounded loop, and it RETURNS rather than throws so
   the caller's finally always runs and a button is never left stuck spinning.
   The cap sits well above the server's own ceiling (120s action, 180s analyst)
   so it is a backstop against an unreachable console, not a limit that fires
   in normal operation. */
async function pollJob(kind, job, maxPolls){
  for(let i=0;i<maxPolls;i++){
    if(i) await sleep(1000);
    let j;
    try{
      const r=await fetch('/api/'+kind+'/'+encodeURIComponent(job));
      j=await r.json();
    }catch(e){
      return { state:'error', error:'lost contact with the console: '+e.message };
    }
    if(j.state==='done') return j;
    if(j.state==='error') return j;
  }
  return { state:'error', error:'still running after '+maxPolls+' seconds' };
}
const pollAsk    = job => pollJob('ask', job, 240);
const pollAction = job => pollJob('action', job, 200);
async function askAI(q){
  if(aiBusy || !q.trim()) return;
  aiBusy=true; aiPending=true;
  const go=document.getElementById('aiGo'); if(go){go.disabled=true;go.textContent='Thinking…';}
  aiAnswer=null;
  // Record WHAT was asked and the snapshot it will be answered from, BEFORE the
  // fetch. S.generated is the same measurement the page is displaying and the
  // same one the server digests, so the stamp on the answer is not a second
  // reading - it is the one that was actually used.
  aiQuestion=q.trim();
  aiFactsAt=(S && S.generated) ? S.generated : new Date().toISOString();
  aiAt=null;
  paintAI();
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q})});
    const j=await r.json();
    if(!j.ok || !j.job){ aiAnswer='ERROR: '+(j.error||'the console did not start the job'); }
    else{
      const done = await pollAsk(j.job);
      aiAnswer = (done.state==='done') ? done.answer : ('ERROR: '+done.error);
    }
    aiAt = new Date();
  }catch(e){ aiAnswer = 'ERROR: '+e.message; aiAt = new Date(); }
  finally{
    aiBusy=false; aiPending=false;
    // The model occasionally emits a real em-dash that arrives as U+FFFD. A single
    // stray replacement char is noise, not information.
    //
    // Written in pure ASCII on purpose. A character class spanning Latin-1 MUST
    // be written with \u escapes: typing the literal characters into this file
    // re-encodes them on the way in, reintroducing the very mojibake this exists
    // to remove. The first version of this fix did precisely that and failed the
    // very check it had just written. Range E0-FF covers the leading byte of a
    // mis-decoded 2- or 3-byte UTF-8 run.
    //
    // ORDER MATTERS, and backwards is why this did not work. A U+FFFD encoded
    // as cp1252 arrives as THREE characters (U+00EF U+00BF U+00BD), so a U+FFFD
    // matcher alone misses it. The decode runs FIRST and produces a real U+FFFD;
    // only then is that replaced. Reversed, the mojibake survives pass one and
    // becomes the very character pass two already ran past. Found by asking
    // /api/ask a real question and reading the answer.
    const clean = s => String(s==null?'':s)
      .replace(/[\u00E0-\u00FF][\u0080-\u00BF][\u0080-\u00BF]?/g,
               m => { try{ return decodeURIComponent(escape(m)); }catch(e){ return m; } })
      .replace(/\uFFFD/g,'-');
    // Clean the RETAINED answer, not a DOM node that no longer exists, then
    // paint through a freshly resolved element.
    aiAnswer = clean(aiAnswer);
    paintAI();
    // Re-resolve the button too. `go` was captured before a ~26 s await, so by
    // now it is a detached node and re-enabling it is wasted work - the poll
    // will have replaced #view, and a fresh enabled Ask button is already on
    // screen. Same shape as the answer bug, one variable smaller.
    const liveGo=document.getElementById('aiGo');
    if(liveGo){liveGo.disabled=false;liveGo.innerHTML=svg('sparkle')+'Ask';}
  }
}

/* ============================== TRENDS ================================= */
/* Calendar heatmap, last 35 days. Severity is the WORST thing that happened
   that day, not the average: averaging a day with one failed check and
   seventeen clean ones hides the failure, which is the exact mistake the
   median baseline elsewhere in this file exists to avoid. */
function activityHeatmap(){
  const days = arr((S.history||{}).by_day);
  if(!days.length){
    return '<div class="dim chart-empty">No history yet. Samples are recorded when a measured value actually changes, so a perfectly stable system records none.</div>';
  }
  const byDay={}; days.forEach(d=>{ byDay[d.day]=d; });
  const today=new Date(); today.setHours(0,0,0,0);
  // LOCAL date, not UTC. The collector buckets with PowerShell's
  // ([datetime]$_.ts).ToString('yyyy-MM-dd'), which is local time. toISOString()
  // is UTC, and this machine is UTC+3 - so any sample taken before 03:00 local
  // lands on the PREVIOUS day and the heatmap silently misfiles it. One
  // coloured cell where there should have been two is exactly that symptom.
  const dayKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const todayKey = dayKey(today);
  const cells=[]; let maxS=1;
  for(let i=34;i>=0;i--){
    const dt=new Date(today.getTime()-i*86400000);
    const key=dayKey(dt);
    const rec=byDay[key];
    let cls='', tip=key+' — no samples recorded';
    if(rec){
      const f=rec.fails||0, w=rec.warns||0;
      if(f>0) cls='s4';
      else if(w>=6) cls='s3';
      else if(w>=1) cls='s2';
      else cls='s1';
      if(rec.samples>maxS) maxS=rec.samples;
      tip=key+' — '+rec.samples+' sample(s), '+w+' warn, '+f+' fail, containers '+
          (rec.minTot===rec.maxTot?rec.minTot:rec.minTot+'–'+rec.maxTot);
    }
    if(key===todayKey) cls+=' today';
    cells.push('<div class="hmday '+cls+'" title="'+esc(tip)+'"></div>');
  }
  const rows=[]; for(let i=0;i<cells.length;i+=7) rows.push('<div class="hmcol">'+cells.slice(i,i+7).join('')+'</div>');
  return '<div class="hm">'+rows.join('')+'</div>'
    +'<div class="hmlegend">'
    +'<span>last 35 days</span>'
    +'<i style="background:rgba(127,127,127,.10)"></i><span>no change</span>'
    +'<i style="background:rgba(34,211,238,.16)"></i><span>sampled, clean</span>'
    +'<i style="background:rgba(251,191,36,.22)"></i><span>warns</span>'
    +'<i style="background:rgba(249,115,22,.28)"></i><span>many warns</span>'
    +'<i style="background:rgba(239,68,68,.34)"></i><span>a failure</span>'
    +'<span style="margin-left:auto">peak '+maxS+' samples/day</span>'
    +'</div>';
}
function viewTrends(){
  const h=S.history||{samples:0,total_series:[],warn_series:[],fail_series:[]};
  const an=S.anomalies||[], inc=S.incidents||[];
  const spark=(vals,acc)=>{
    if(!vals||vals.length<2) return '<div class="dim" style="margin-top:8px">not enough history yet — the baseline builds as samples arrive</div>';
    const mx=Math.max(...vals), mn=Math.min(...vals), sp=(mx-mn)||1;
    return '<div class="spark" style="--acc:var(--'+acc+');height:40px">'
      +vals.map(v=>'<i style="height:'+Math.max(6,Math.round(38*((v-mn)/sp)))+'%"></i>').join('')
      +'</div><div class="dim" style="font-size:10px;margin-top:5px">'+vals.length+' samples · min '+mn+' · max '+mx+'</div>';
  };
  return '<div class="grid">'
   +'<div class="card" style="--acc:var(--orange)"><h2>'+svg('layers')+'Container count over time</h2>'
   +'<p class="sub">One sample is recorded per genuine change, not per poll. A quiet system does not invent history.</p>'
   +kv('<span>'+svg('file')+'</span>samples',h.samples)
   +kv('<span>'+svg('clock')+'</span>first',esc((h.first||'').replace('T',' ').slice(0,19)))
   +kv('<span>'+svg('clock')+'</span>latest',esc((h.last||'').replace('T',' ').slice(0,19)))
   +areaChart(h.total_series,'emerald',300)+'</div>'
   +'<div class="card" style="--acc:var(--indigo)"><h2>'+tic('activity','ti-lg')+'Activity by day</h2>'
   +'<p class="sub">One cell per day for the last 35. The colour is the worst thing that happened, not the average: a day with one failed check and seventeen clean ones is a day with a failure.</p>'
   +activityHeatmap()
   +note('Empty cells are not missing data. A sample is recorded only when a measured value actually CHANGED, so a day the system sat perfectly still is blank by design.','info')
   +'</div>'
   +'<div class="card" style="--acc:var(--amber)"><h2>'+svg('warn')+'Anomalies</h2>'
   +'<p class="sub">A current value that departs from the median of its recent samples. That is the one that matters — an average would let a single spike drag the baseline and hide itself.</p>'
   +(an.length
     ? arr(an).map(a=>'<div class="kv"><span>'+esc(a.metric)+'</span><span class="warn">'+esc(a.value)
       +' <span class="dim">vs '+esc(a.baseline)+'</span></span></div>'
       +'<div class="dim" style="font-size:10.5px;padding:0 0 6px">'+esc(a.deviation_pct)+'% from baseline — '+esc(a.note)+'</div>').join('')
     : '<span class="ok">nothing deviating from its baseline</span>')+'</div>'
   +'<div class="card" style="--acc:var(--cyan)"><h2>'+svg('gauge')+'Bridge warnings over time</h2>'
   +'<p class="sub">Warn is normal here. A step UP in this series is what you want to catch.</p>'
   +areaChart(h.warn_series,'amber',220)
   +'<div style="margin-top:10px">'+kv('<span>'+svg('warn')+'</span>warnings now',(h.warn_series||[]).length?h.warn_series[h.warn_series.length-1]:0)
   +kv('<span>'+svg('x')+'</span>failures now',(h.fail_series||[]).length?h.fail_series[h.fail_series.length-1]:0)+'</div></div>'
   +'<div class="card" style="--acc:var(--indigo)"><h2>'+svg('clock')+'Recent incidents</h2>'
   +'<p class="sub">Transitions, not states. Each entry is a moment something actually moved, and everything else that moved with it.</p>'
   /* Capped and scrollable. Thirteen entries ran this card to ~1075 px, which
      made its whole grid row 1075 px tall and left ~800 px of empty card
      either side of it. The list is a reference, not the headline: the newest
      few are what an operator reads, and the rest is one scroll away. */
   +'<div class="incroll">'
   +(inc.length
     ? arr(inc).slice().reverse().map(i=>{
        // PowerShell collapses a single-element array to a scalar on the way
        // through JSON, so an incident recording exactly ONE change arrives as a
        // bare string and .map is not a function - which threw and took the
        // whole Trends tab down with it. Normalise before mapping.
        var ch=(i.changes==null)?[]:(Array.isArray(i.changes)?i.changes:[i.changes]);
        return '<div style="padding:9px 0;border-bottom:1px solid rgba(127,127,127,.14)">'
       +'<div class="dim">'+esc((i.at||'').replace('T',' ').slice(0,19))+'</div>'
       +'<div style="margin-top:4px">'+ch.map(c=>'<span class="chip" style="margin:2px 3px 0 0;display:inline-block">'+esc(c)+'</span>').join('')+'</div></div>';
       }).join('')
     : '<div class="dim">no recorded transitions yet. The first real change will appear here with a timestamp.</div>')+'</div></div>'
   /* Sixth card, and it exists for two reasons. The grid is three wide, so five
      cards left a dead quadrant; and the two charts above show SHAPE while
      saying nothing about MAGNITUDE. "Which value actually moved, and by how
      much, across the whole window" is the question an operator opens this tab
      to answer, and neither chart answers it. A series that never moved is
      reported as such rather than left to look healthy - an unmeasured series
      and a stable one are different facts. */
   +'<div class="card" style="--acc:var(--emerald)"><h2>'+svg('gauge')+'Biggest movers</h2>'
   +'<p class="sub">The swing in each tracked value across the whole window. A series that never moved is not necessarily a healthy one.</p>'
   +(function(){
      const series=[
        {k:'containers',        s:h.total_series},
        {k:'bridge warnings',   s:h.warn_series},
        {k:'bridge failures',   s:h.fail_series}
      ];
      const rows=series.map(x=>{
        const nums=Array.isArray(x.s)?x.s.filter(v=>typeof v==='number'&&isFinite(v)):[];
        if(nums.length<2) return '';
        const lo=Math.min.apply(null,nums), hi=Math.max.apply(null,nums), swing=hi-lo;
        return '<div class="kv"><span>'+esc(x.k)+'</span><span class="'+(swing?'warn':'ok')+'">'+lo+' &rarr; '+hi
          +(swing?' <span class="dim">+' + swing + '</span>':' <span class="dim">never moved</span>')+'</span></div>';
      }).filter(Boolean).join('');
      return rows || '<span class="dim">not enough samples in the window to measure a swing</span>';
    })()
   +'</div></div>';
}

/* ============================== RESILIENCE ==============================
   The one tab whose subject is the dashboard itself. It exists because the
   console sat dead for 19.5 hours with nothing reporting it - so the system
   now reports on its own survival, from the same snapshot everything else
   reads, rather than waiting to be noticed. */
function _dur(n){
  if(n==null || isNaN(n)) return '—';
  if(n < 90) return Math.round(n)+'s';
  if(n < 5400) return Math.round(n/60)+' min';
  return (n/3600).toFixed(1)+' h';
}
function viewResilience(){
  const s = S.supervision || {};
  const acc = s.known ? (s.healthy ? 'var(--emerald)' : 'var(--st-active)') : 'var(--amber)';
  const since  = s.last_restart     ? Math.round((Date.now() - new Date(s.last_restart).getTime())/1000)     : null;
  const uptime = s.watchdog_started ? Math.round((Date.now() - new Date(s.watchdog_started).getTime())/1000) : null;
  const restarts = s.restarts || 0;
  const stale = (s.state_age_sec != null && s.state_age_sec > 120);

  return '<div class="grid">'
   /* ---- the verdict ---- */
   +'<div class="card" style="--acc:'+acc+'"><h2>'+tic('heartbeat')+(s.known ? (s.healthy?'Supervised and healthy':'Supervisor reports trouble') : 'Nothing is watching this server')+'</h2>'
   +'<p class="sub">Read from the supervisor\'s own last check, inside the same live snapshot as every other number here — so this tab cannot disagree with Overview about what is true.</p>'
   +(s.known
     ? kv('<span>'+tic(s.healthy?'check':'warn')+'</span>verdict', s.healthy ? 'HEALTHY' : 'UNHEALTHY', s.healthy?'ok':'bad')
     : note('No supervisor has ever reported. Nothing owns this process: if it dies it stays dead, which is precisely what happened for 19.5 hours before this existed.','bad'))
   +kv('<span>'+tic('activity')+'</span>checked every', _dur(s.interval_sec))
   +kv('<span>'+tic('clock')+'</span>served state age', s.state_age_sec==null?'—':Math.round(s.state_age_sec)+'s', stale?'warn':'ok')
   +kv('<span>'+tic('refresh')+'</span>restarts so far', restarts, restarts?'warn':'ok')
   +(s.last_restart
     ? kv('<span>'+tic('clock')+'</span>last restart', _dur(since)+' ago', 'warn')
     : note('No restart has been needed since the supervisor started.','info'))
   +(s.last_restart_reason && !s.healthy
     ? note('Last trigger: '+esc(s.last_restart_reason),'bad') : '')
   +'</div>'

   /* ---- the supervisor process ---- */
   +'<div class="card" style="--acc:var(--cyan)"><h2>'+tic('shield')+'The supervisor</h2>'
   +'<p class="sub">A separate PowerShell process with one job: decide whether the server is really serving, and restart it if not.</p>'
   +kv('<span>'+tic('cpu')+'</span>process id', s.watchdog_pid==null?'—':s.watchdog_pid)
   +kv('<span>'+tic('clock')+'</span>watching for', _dur(uptime))
   +kv('<span>'+tic('server')+'</span>port', 8900)
   +kv('<span>'+tic('file')+'</span>health file', 'api/cc-health.json')
   +kv('<span>'+tic('file')+'</span>supervisor log', s.log ? 'logs\\watchdog.log' : 'not found yet', s.log?'ok':'warn')
   +note('Health is measured end to end — the port must accept a connection <em>and</em> <code>/api/state</code> must return state younger than 5 minutes. Checking only the socket would pass on a wedged process.','info')
   +'</div>'

   /* ---- what it does and does not cover ---- */
   +'<div class="card" style="--acc:var(--indigo)"><h2>'+tic('info')+'What it covers, and what it does not</h2>'
   +'<p class="sub">A supervisor with more confidence than coverage is worse than none, so here is the honest boundary.</p>'
   +'<div class="li ok">'+tic('check')+'<span>Covered: the server process dying, the port closing, the refresher wedging, the served state going stale.</span></div>'
   +'<div class="li ok">'+tic('check')+'<span>Covered: a wedged process that still holds the port open while the data behind it rots.</span></div>'
   +'<div class="li warn" style="margin-top:8px">'+tic('warn')+'<span>Not covered: Windows itself. The supervisor is a process, so it does not outlive a reboot.</span></div>'
   +'<div class="li warn">'+tic('warn')+'<span>Not covered: the 56 containers. Docker restarts those on its own; nothing here restarts Docker.</span></div>'
   +note('If the watchdog process itself is killed, nothing restarts it. Start it with <code>cc watchdog</code>, or install the logon task so it comes back with you.','info')
   +'</div>'

   /* ---- the evidence ---- */
   +'<div class="card" style="--acc:var(--amber);grid-column:1/-1"><h2>'+tic('file')+'Supervisor log</h2>'
   +'<p class="sub">The supervisor\'s own record, verbatim. Restarts are explained here rather than only counted.</p>'
   +((s.recent && s.recent.length)
     ? '<pre class="out" style="max-height:300px;margin-top:0">'+esc(s.recent.join('\n'))+'</pre>'
     : note('No log entries yet. The supervisor writes one line per state change, not per check, so a quiet log is the expected resting state.','info'))
   +'</div>'
   +'</div>';
}

/* Front-end integrity, checked IN THE PAGE.
   scripts\verify-ui.ps1 covers the file-level half (parse, encoding, assets, API).
   It cannot drive a browser, so these are the checks only a loaded page can make:
   did the script actually run, do all 15 tabs render, do the glyphs paint.
   A parse error is the case that matters - the page still renders its skeleton,
   the response is still 200, and the console is still silent, because no
   statement ever ran. So the first check is simply "am I running at all". */
const SELFTEST = { ran:false, results:[], at:null };

/* The last NotebookLM answer, held OUTSIDE any handler so a re-render can put
   it back. Declared inside the wiring block it worked for the button and threw
   "NBANSWER is not defined" in viewOverview, which reads it - and the symptom
   was a blank page that still answered HTTP 200. Scope is not a detail here. */
let NBANSWER = null;
function uiSelfTest(){
  const R=[];
  const push=(n,ok,d)=>R.push({n:n,ok:!!ok,d:d});
  // 1. did the script execute at all
  push('script executed', typeof render==='function', 'typeof render = '+(typeof render));
  // 2. structure
  const navs=arr(document.querySelectorAll('nav button'));
  // exact, not >=. With 15 tabs a ">= 14" check still passes if one is missing.
  push('all tabs present', navs.length===15, navs.length+' tabs in the nav (expected 15)');
  // 3. every tab must render without throwing
  const ids=['overview','ai','trends','docker','bridges','services','qwen','update','minimax','skills','projects','docs','command','resilience','fabric'];
  const keep=active, fails=[], unwired=[];
  let ctlCount=0;
  ids.forEach(function(t){ try{ active=t; render();
        var v=document.getElementById('view');
        if(/undefined|NaN|\[object/.test(v.textContent)) fails.push(t+':dirty');
        if(!v.querySelector('.card')) fails.push(t+':empty');
        /* A control can render perfectly and still do nothing. The AI Analyst
           passed every other check in this file for its entire life - correct
           markup, painted glyphs, live data, no errors - and the Ask button was
           writing its answer into a node the poll had already detached. A check
           that the view is not EMPTY is not a check that the view WORKS.
           So: does every control in the rendered view have a handler? */
        var ctrls=v.querySelectorAll('button, tr[data-n], [data-q], [data-id]');
        ctlCount+=ctrls.length;
        for(var i=0;i<ctrls.length;i++){
          var el=ctrls[i];
          if(el.disabled) continue;                       // a disabled control has nothing to prove
          if(!el.onclick) unwired.push(t+':'+(el.id||el.dataset.id||el.dataset.n||
                                              String(el.dataset.q||'').slice(0,18)||el.tagName));
        }
      }catch(e){ fails.push(t+':'+e.message); } });
  active=keep; render();
  push('every tab renders', fails.length===0, fails.length?fails.join(', '):(ids.length+'/'+ids.length+' clean'));
  push('controls are wired', unwired.length===0,
       unwired.length ? (unwired.length+' unwired: '+unwired.slice(0,4).join(', '))
                      : (ctlCount+' controls across '+ids.length+' tabs, all bound'));
  // 4. glyphs must actually paint
  const ico=arr(document.querySelectorAll('.ti'));
  let blank=0;
  ico.forEach(function(i){ var c=getComputedStyle(i,'::before').content;
    if(!c||c==='none'||c==='normal') blank++; });
  push('icons paint', blank===0, ico.length+' glyphs, '+blank+' blank');
  push('icon font loaded', document.fonts?document.fonts.check('16px tabler-icons'):false, 'tabler-icons');
  // 5. stand-alone
  var ext=0;
  try{ performance.getEntriesByType('resource').forEach(function(r){
        if(r.name.indexOf('127.0.0.1')===-1 && r.name.indexOf('localhost')===-1) ext++; }); }catch(e){}
  push('no external resources', ext===0, ext+' external request(s)');
  // 6. data
  var age = S && S.generated ? Math.round((Date.now()-new Date(S.generated).getTime())/1000) : -1;
  push('state is fresh', age>=0 && age<180, 'age '+age+'s');
  SELFTEST.results=R; SELFTEST.ran=true; SELFTEST.at=new Date();
  return R;
}
/* A check that the view is not EMPTY is not a check that the view WORKS. The
   structural pass above proves every control has a handler; this one RUNS the
   slowest, most consequential handler with a stubbed fetch and proves the
   result reaches the live DOM. That is the only thing that would have caught
   the AI Analyst writing its answer into a node the poll had already
   detached - a bug that passed every other check here for its whole life. */
async function uiSelfTestBehaviour(){
  const R=[];
  const push=(n,ok,d)=>R.push({n:n,ok:!!ok,d:d});
  /* If a real question is in flight, askAI early-returns on aiBusy, the canary
     never lands, and this check reports the page broken when it is fine. That
     is a false alarm with a user-visible consequence - the button would say a
     healthy console is broken. Skip instead, and say so on the card. */
  if(aiBusy){
    push('analyst answer reaches the live DOM', true, 'skipped - a question was already in flight');
    push('analyst survives a re-render', true, 'skipped - see above');
    return R;
  }
  const SENTINEL='WIRED-CANARY-'+(SELFTEST.at?SELFTEST.at.getTime():0);
  const realFetch=window.fetch;
  /* The stub must speak the protocol the server ACTUALLY has. /api/ask is now
     two steps - POST returns a job id, GET /api/ask/<id> returns the result - so
     a stub answering the POST with the answer itself would pass while proving
     nothing: the real polling loop, the real job lookup and the real 'done'
     transition would never run. This exercises all three. */
  window.fetch=function(u,o){
    if(String(u).indexOf('/api/ask')>=0){
      const isPost = !!(o && o.method==='POST');
      return Promise.resolve({ ok:true, json:function(){
        return Promise.resolve(isPost
          ? { ok:true, job:'a1b2c3d4e5f6', state:'running' }
          : { ok:true, state:'done', answer:SENTINEL }); } });
    }
    return realFetch.apply(window, arguments);
  };
  const keep=active;
  try{
    active='ai'; render();
    /* A hard cap on the canary. /api/ask has no AbortController and has been
       measured at 12-43 s, so a hung request would never settle - and `finally`
       would never run, leaving window.fetch stubbed FOREVER. Every later poll
       would then be served the canary shape and the whole console would
       quietly stop updating. The stub must never outlive this function. */
    await Promise.race([ askAI('canary'),
                         new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('canary did not settle within 20s')); }, 20000); }) ]);
    /* Re-render the SAME tab, which is exactly what the 5 s poll does. It used
       to switch to another tab first, which made this check ask for #aiOut on
       a view that has none - the test was wrong, and it reported a failure for
       a healthy page. The instrument has to reproduce the real scenario. */
    render();
    const el=document.getElementById('aiOut');   // re-resolve, never reuse
    const live = !!el && document.contains(el);
    const got  = live && (el.textContent||'').indexOf(SENTINEL)>=0;
    push('analyst answer reaches the live DOM', got,
         live ? ((el.textContent||'').slice(0,44)) : 'no connected #aiOut after re-render');
    push('analyst survives a re-render', aiAnswer!==null && aiAnswer.indexOf(SENTINEL)>=0,
         aiAnswer===null ? 'answer was not retained' : 'answer retained across render()');
  }catch(e){ push('analyst answer reaches the live DOM', false, e.message); }
  finally{ window.fetch=realFetch; aiAnswer=null; aiPending=false; active=keep; render(); }
  return R;
}
