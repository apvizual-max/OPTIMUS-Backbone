# =============================================================================
#  mavis-sentinel-hub - local deployment front
#  Built by Mavis for SENTINEL PRIME.
#
#  WHAT THIS IS: the deployment surface, in the same shape a public deployment
#  would have. One stable, container-owned address. Health gating. A single
#  place to add TLS later, when Popy decides the system goes public.
#
#  WHAT THIS IS NOT: a second copy of the app. This image contains no
#  dashboard, no state and no corpus. It proxies to the Windows service that
#  owns those facts. A copy would drift, and a drifted copy is worse than no
#  deployment at all - it would answer with numbers nobody measured.
#
#  The dashboard is Windows-native because it reads Windows-only facts (WMI,
#  Get-NetTCPConnection, the mavis/Hermes CLI, the Docker Windows engine), so
#  the data plane stays on the host. This is the web plane.
#
#  Reachability: the published port is bound to 127.0.0.1 in the run command.
#  Reachable from this machine, nowhere else. NOT public.
# =============================================================================

upstream sentinel_backend {
    # host.docker.internal is Docker's name for the Windows host. The
    # SENTINEL Command Center service listens on 8912 there - the internal
    # port, behind this front. 8910 is the public-facing one and belongs to
    # THIS container; 8900 belongs to the separate OPTIMUS Control Center and
    # must never be touched.
    server host.docker.internal:8912;
    keepalive 8;
}

server {
    listen      80;
    server_name localhost;

    # Behind a public edge this would be the TLS block. Declared now so the
    # transition is a matter of supplying a certificate, not a rewrite.
    # --- TLS goes here when the system goes public. Not before. ---

    # The dashboard is a single-page app served by the backend, so the root is
    # proxied wholesale. No static root on purpose.
    location / {
        proxy_pass         http://sentinel_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # /api/action runs a whitelisted command on the host and can take a
        # while before it answers. A truncated action is worse than a slow one,
        # so the read timeout is generous and deliberately NOT uniform.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering      off;
        proxy_cache          off;
    }

    # /api/stream is Server-Sent Events, and it is SHORT-LIVED BY DESIGN.
    #
    # It gets its own location because it needs its own buffering decision,
    # NOT because it is a long-lived pipe. The Windows backend is a
    # single-threaded HttpListener: holding a response open would block every
    # other route, including the /api/state call the same page needs. So it
    # sends the state, flushes and closes, and the browser's EventSource
    # reconnects at the collector's cadence.
    #
    # CORRECTION, because the first version of this comment was wrong and the
    # wrongness mattered: an earlier draft justified a 24h read timeout here by
    # claiming a generic 300s timeout would "cut a healthy stream and the UI
    # would reconnect every five minutes forever". That describes a stream that
    # does not exist. A read timeout here is insurance against a hung BACKEND,
    # not a fix for a periodic reconnect - and writing a mechanism into a
    # comment that the code does not have is the same defect as writing a
    # comment where a check belongs: the next reader counts it as coverage.
    location = /api/stream {
        proxy_pass         http://sentinel_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_buffering      off;
        proxy_cache          off;
        chunked_transfer_encoding on;

        # Generous, because the backend is meant to answer this in about a
        # second. If it ever takes longer than this, the backend is wedged and
        # saying so beats holding the socket open forever.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # A dedicated liveness path, separate from the app, so "is the gateway up"
    # and "is the dashboard behind it up" are two different questions that can
    # be answered independently. A health check that only ever asks the app
    # cannot tell a dead gateway from a dead app, and reports the wrong one.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"mavis-sentinel-hub","role":"deployment-front","status":"ok","public":false}';
    }

    # Readiness of the thing BEHIND the gateway. If the Windows service has not
    # come up yet, this says so plainly instead of returning a dashboard error
    # page that looks like a broken app.
    location = /readyz {
        access_log off;
        proxy_pass         http://sentinel_backend/api/state;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    8s;
    }

    # What a public deployment would send. Present in local form so the header
    # set is exercised now rather than discovered on the day of launch. The
    # frame ancestors and referrer policy are the two that actually matter for
    # a dashboard; the rest are cheap and correct.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header X-SENTINEL-Deployment  "mavis-sentinel-hub" always;
}
